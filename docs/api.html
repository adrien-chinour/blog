<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>API Reference | adrien-chinour/blog</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css">
  <style>
    body { margin: 0; }
    .topbar { display: none; }
    .back { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 12px 20px; background: #f6f8fa; border-bottom: 1px solid #e1e4e8; }
    .back a { color: #42b983; text-decoration: none; }
  </style>
</head>
<body>
<div class="back"><a href="./#/">&larr; Back to documentation</a> &middot; Generated from the code with NelmioApiDocBundle (<code>composer docs:api</code>)</div>
<div id="swagger-ui"></div>
<script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js" crossorigin></script>
<script>
  window.onload = () => {
    window.ui = SwaggerUIBundle({
      url: 'reference/openapi.json',
      dom_id: '#swagger-ui',
      deepLinking: true,
      defaultModelsExpandDepth: 1,
      tryItOutEnabled: false,
    });
  };
</script>
</body>
</html>
