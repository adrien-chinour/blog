version: 2
updates:
    -   package-ecosystem: "composer"
        directory: "/"
        schedule:
            interval: "weekly"
            day: "monday"
            time: "06:00"
            timezone: "Europe/Paris"
        open-pull-requests-limit: 10
        # Only touch composer.json when the new version does not fit the current constraint
        versioning-strategy: increase-if-necessary
        ignore:
            # Symfony major upgrades (7.4.* -> 8.x) are a deliberate migration, not a Dependabot PR
            -   dependency-name: "symfony/*"
                update-types: [ "version-update:semver-major" ]
        groups:
            symfony:
                patterns: [ "symfony/*" ]
            open-telemetry:
                patterns: [ "open-telemetry/*" ]
            dev-tools:
                dependency-type: "development"
        labels: [ "dependencies", "composer" ]
        commit-message:
            prefix: "chore(deps)"

    -   package-ecosystem: "github-actions"
        directory: "/"
        schedule:
            interval: "weekly"
            day: "monday"
            time: "06:00"
            timezone: "Europe/Paris"
        groups:
            actions:
                patterns: [ "*" ]
        labels: [ "dependencies", "ci" ]
        commit-message:
            prefix: "ci(deps)"

    -   package-ecosystem: "docker"
        directory: "/"
        schedule:
            interval: "weekly"
            day: "monday"
            time: "06:00"
            timezone: "Europe/Paris"
        labels: [ "dependencies", "docker" ]
        commit-message:
            prefix: "chore(deps)"

    -   package-ecosystem: "docker-compose"
        directory: "/"
        schedule:
            interval: "weekly"
            day: "monday"
            time: "06:00"
            timezone: "Europe/Paris"
        labels: [ "dependencies", "docker" ]
        commit-message:
            prefix: "chore(deps)"
