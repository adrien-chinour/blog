name: Publish Docker Base Image
on:
    workflow_dispatch:
    schedule:
        # Weekly rebuild to pick up upstream PHP / FrankenPHP security patches
        -   cron: "0 4 * * 1"
    push:
        branches: [ "main" ]
        paths:
            - "Dockerfile"
            - ".docker/**"
            - ".github/workflows/docker_base_image.yaml"

env:
    IMAGE_NAME: "ghcr.io/adrien-chinour/blog:base-php8.4"

jobs:
    build-and-push-image:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v5

            -   name: Log in to the Container registry
                uses: docker/login-action@v4
                with:
                    registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   name: Build and push
                uses: docker/build-push-action@v7
                with:
                    push: true
                    pull: true # always fetch the latest upstream frankenphp image
                    context: .
                    target: frankenphp_base
                    tags: ${{ env.IMAGE_NAME }}

            -   name: Report PHP version
                run: |
                    docker run --rm --entrypoint php "$IMAGE_NAME" -v | head -1 >> "$GITHUB_STEP_SUMMARY"
