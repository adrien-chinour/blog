name: Publish Docker Base Image
on:
    workflow_dispatch:
    schedule:
        # Weekly rebuild to pick up upstream PHP / FrankenPHP security patches
        -   cron: "0 4 * * 1"
    push:
        branches: [ "main" ]
        paths:
            - "Dockerfile"
            - ".docker/**"
            - ".github/workflows/docker_base_image.yaml"

env:
    IMAGE_NAME: "ghcr.io/adrien-chinour/blog:base-php8.4"

jobs:
    build-and-push-image:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
            security-events: write # SARIF upload to the Security tab
        steps:
            -   name: Checkout repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: Log in to the Container registry
                uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
                with:
                    registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   name: Build and push
                uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
                with:
                    push: true
                    pull: true # always fetch the latest upstream frankenphp image
                    context: .
                    target: frankenphp_base
                    tags: ${{ env.IMAGE_NAME }}

            -   name: Report PHP version
                run: |
                    docker run --rm --entrypoint php "$IMAGE_NAME" -v | head -1 >> "$GITHUB_STEP_SUMMARY"

            -   name: Scan published image for vulnerabilities
                id: scan
                uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
                with:
                    image: ${{ env.IMAGE_NAME }}
                    fail-build: true
                    severity-cutoff: critical
                    only-fixed: true

            -   name: Upload scan results to GitHub Security
                if: always() && steps.scan.outputs.sarif != ''
                uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
                with:
                    sarif_file: ${{ steps.scan.outputs.sarif }}
                    category: grype-base-image
