name: "Quality checks"

on:
    push:
        branches: [ "main" ]
    pull_request:

# One run per branch: a new push cancels the previous in-progress run.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality_check:
        name: "Quality & tests"
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write # coverage comment on PRs
        steps:
            -   name: "Checkout"
                uses: actions/checkout@v5

            -   name: "Setup PHP"
                uses: shivammathur/setup-php@v2
                with:
                    # Single source of truth for the PHP version: .php-version (keep in sync with the Dockerfile)
                    php-version-file: .php-version
                    extensions: mbstring, ctype, iconv, intl, opentelemetry
                    coverage: pcov
                    tools: composer:v2
                env:
                    update: true

            -   name: "Validate composer.json and composer.lock"
                run: composer validate --strict

            -   name: "Install dependencies"
                uses: ramsey/composer-install@v3
                with:
                    composer-options: "--no-scripts --prefer-dist"

            -   name: "Coding style (ECS)"
                run: composer quality:ecs -- --no-progress-bar

            -   name: "Static analysis (PHPStan)"
                run: composer quality:phpstan -- --no-progress --error-format=github

            -   name: "Architecture rules (PHPArkitect)"
                run: composer quality:arkitect

            -   name: "Tests with coverage (PHPUnit)"
                run: composer test-coverage

            -   name: "Coverage summary"
                uses: irongut/CodeCoverageSummary@v1.3.0
                with:
                    filename: var/coverage/cobertura.xml
                    format: markdown
                    output: both
                    badge: true
                    hide_complexity: true
                    indicators: true
                    # <70% fails the job, 70-85% orange, >=85% green
                    thresholds: '70 85'
                    fail_below_min: true

            -   name: "Publish coverage to job summary"
                if: always()
                run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"

            -   name: "Comment coverage on PR"
                if: github.event_name == 'pull_request'
                uses: marocchino/sticky-pull-request-comment@v2
                with:
                    header: coverage
                    recreate: true
                    path: code-coverage-results.md

            -   name: "Upload HTML coverage report"
                if: always()
                uses: actions/upload-artifact@v4
                with:
                    name: coverage-html
                    path: var/coverage/html
                    retention-days: 14

    security_check:
        name: "Security"
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write # SARIF upload to the Security tab
        steps:
            -   name: "Checkout"
                uses: actions/checkout@v5

            -   name: "Setup PHP"
                uses: shivammathur/setup-php@v2
                with:
                    php-version-file: .php-version
                    coverage: none
                    tools: composer:v2

            -   name: "Composer audit (PHP security advisories)"
                run: composer audit --locked

            -   name: "Create SBOM"
                uses: anchore/sbom-action@v0
                with:
                    format: spdx-json
                    output-file: "${{ github.event.repository.name }}-sbom.spdx.json"

            -   name: "Scan SBOM"
                id: scan
                uses: anchore/scan-action@v7
                with:
                    sbom: "${{ github.event.repository.name }}-sbom.spdx.json"
                    fail-build: true
                    severity-cutoff: critical

            -   name: "Upload scan results to GitHub Security"
                if: always() && steps.scan.outputs.sarif != ''
                uses: github/codeql-action/upload-sarif@v4
                with:
                    sarif_file: ${{ steps.scan.outputs.sarif }}
                    category: grype
