name: "Quality checks"

on:
    push:
        branches: [ "main" ]
    pull_request:

# One run per branch: a new push cancels the previous in-progress run.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality_check:
        name: "Quality & tests"
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write # coverage comment on PRs
        steps:
            -   name: "Checkout"
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: "Setup PHP"
                uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
                with:
                    # Single source of truth for the PHP version: .php-version (keep in sync with the Dockerfile)
                    php-version-file: .php-version
                    extensions: mbstring, ctype, iconv, intl, opentelemetry
                    coverage: pcov
                    tools: composer:v2
                env:
                    update: true

            -   name: "Validate composer.json and composer.lock"
                run: composer validate --strict

            -   name: "Install dependencies"
                uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
                with:
                    composer-options: "--no-scripts --prefer-dist"

            -   name: "Symfony lints (YAML, container)"
                run: composer quality:lint

            -   name: "Coding style (ECS)"
                run: composer quality:ecs -- --no-progress-bar

            -   name: "Static analysis (PHPStan)"
                run: composer quality:phpstan -- --no-progress --error-format=github

            -   name: "Architecture rules (PHPArkitect)"
                run: composer quality:arkitect

            -   name: "Automated refactoring check (Rector dry-run)"
                run: composer quality:rector -- --no-progress-bar

            -   name: "Dependency hygiene (composer-require-checker, composer-unused)"
                run: composer quality:deps

            -   name: "OpenAPI specification is up to date"
                run: |
                    composer docs:api
                    git diff --exit-code -- docs/reference/openapi.json || {
                      echo "::error file=docs/reference/openapi.json::docs/reference/openapi.json is out of date, run 'make doc-api' and commit the result"
                      exit 1
                    }

            -   name: "Tests with coverage (PHPUnit)"
                run: composer test-coverage

            -   name: "Coverage summary"
                uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
                with:
                    filename: var/coverage/cobertura.xml
                    format: markdown
                    output: both
                    badge: true
                    hide_complexity: true
                    indicators: true
                    # <70% fails the job, 70-85% orange, >=85% green
                    thresholds: '70 85'
                    fail_below_min: true

            -   name: "Publish coverage to job summary"
                if: always() && hashFiles('code-coverage-results.md') != ''
                run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"

            -   name: "Comment coverage on PR"
                if: github.event_name == 'pull_request'
                uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
                with:
                    header: coverage
                    recreate: true
                    path: code-coverage-results.md

            -   name: "Upload HTML coverage report"
                if: always()
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    name: coverage-html
                    path: var/coverage/html
                    retention-days: 14

    security_check:
        name: "Security"
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write # SARIF upload to the Security tab
        steps:
            -   name: "Checkout"
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: "Setup PHP"
                uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
                with:
                    php-version-file: .php-version
                    coverage: none
                    tools: composer:v2

            -   name: "Composer audit (PHP security advisories)"
                run: composer audit --locked

            -   name: "Create SBOM"
                uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
                with:
                    format: spdx-json
                    output-file: "${{ github.event.repository.name }}-sbom.spdx.json"

            -   name: "Scan SBOM"
                id: scan
                uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
                with:
                    sbom: "${{ github.event.repository.name }}-sbom.spdx.json"
                    fail-build: true
                    severity-cutoff: critical

            -   name: "Upload scan results to GitHub Security"
                if: always() && steps.scan.outputs.sarif != ''
                uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
                with:
                    sarif_file: ${{ steps.scan.outputs.sarif }}
                    category: grype

    mutation_testing:
        name: "Mutation testing"
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            -   name: "Checkout"
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: "Setup PHP"
                uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
                with:
                    php-version-file: .php-version
                    extensions: mbstring, ctype, iconv, intl, opentelemetry
                    coverage: pcov
                    tools: composer:v2

            -   name: "Install dependencies"
                uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
                with:
                    composer-options: "--no-scripts --prefer-dist"

            -   name: "Infection (unit test suite)"
                run: composer test-mutation -- --min-msi=80 --min-covered-msi=80 --logger-github

            -   name: "Upload Infection logs"
                if: always()
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    name: infection-logs
                    path: var/infection/*.log
                    retention-days: 14
