name: Run k6 API testsuite
on:
    workflow_dispatch:

jobs:
    run-test:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: Setup K6
                uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2

            -   name: Run local k6 / API Smoke testing
                uses: grafana/run-k6-action@4082a08c7e40cf6d65863911077dfb60ae0a4f04 # v1.5.0
                env:
                    K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}
                    K6_CLOUD_PROJECT_ID: ${{ secrets.K6_CLOUD_PROJECT_ID }}
                    AUTH_TOKEN: ${{ secrets.ADMIN_AUTH_TOKEN }}
                with:
                    path: k6/api-smoke.js

            -   name: Run local k6 / API Stress testing
                uses: grafana/run-k6-action@4082a08c7e40cf6d65863911077dfb60ae0a4f04 # v1.5.0
                env:
                    K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}
                    K6_CLOUD_PROJECT_ID: ${{ secrets.K6_CLOUD_PROJECT_ID }}
                    AUTH_TOKEN: ${{ secrets.ADMIN_AUTH_TOKEN }}
                with:
                    path: k6/api-stress.js
